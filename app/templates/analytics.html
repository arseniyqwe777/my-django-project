{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h2><i class="fas fa-chart-line"></i> Аналитика</h2>

    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card bg-primary text-white">
                <div class="card-body">
                    <h5>Всего книг</h5>
                    <h2 id="total-books">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-success text-white">
                <div class="card-body">
                    <h5>В избранном</h5>
                    <h2 id="total-favorites">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card bg-info text-white">
                <div class="card-body">
                    <h5>Просмотров</h5>
                    <h2 id="total-views">0</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5>Активность за 30 дней</h5>
                </div>
                <div class="card-body">
                    <canvas id="activityChart"></canvas>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h5>Топ книг</h5>
                </div>
                <div class="card-body">
                    <ul id="top-books" class="list-group">
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/api/analytics/')
            .then(response => response.json())
            .then(data => {
                // Обновить карточки
                document.getElementById('total-books').textContent = data.total_books;
                document.getElementById('total-favorites').textContent = data.total_favorites;
                document.getElementById('total-views').textContent = data.total_views;

                // Топ книг
                const topBooksList = document.getElementById('top-books');
                data.top_books.forEach(book => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center';
                    li.innerHTML = `${book.title} <span class="badge bg-primary rounded-pill">${book.favorites}</span>`;
                    topBooksList.appendChild(li);
                });

                // График активности
                const ctx = document.getElementById('activityChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.daily.map(d => d.date),
                        datasets: [
                            {
                                label: 'Просмотры',
                                data: data.daily.map(d => d.total_views || 0),
                                borderColor: '#0d6efd',
                                backgroundColor: 'rgba(13, 110, 253, 0.1)',
                                fill: true,
                                tension: 0.4
                            },
                            {
                                label: 'В избранное',
                                data: data.daily.map(d => d.total_favorites || 0),
                                borderColor: '#198754',
                                backgroundColor: 'rgba(25, 135, 84, 0.1)',
                                fill: true,
                                tension: 0.4
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'top',
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            })
            .catch(error => console.error('Error:', error));
    });
</script>
{% endblock %}
